name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install PyQt6 bleak pyinstaller

    - name: Create admin manifest
      run: |
        @"
        <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
          <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
            <security>
              <requestedPrivileges>
                <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/>
              </requestedPrivileges>
            </security>
          </trustInfo>
        </assembly>
        "@ | Out-File -FilePath admin.manifest -Encoding UTF8

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --manifest admin.manifest --hidden-import bleak --hidden-import bleak.backends.winrt --hidden-import bleak.backends.winrt.client --hidden-import bleak.backends.winrt.scanner --hidden-import PyQt6 --hidden-import PyQt6.QtWidgets --hidden-import PyQt6.QtCore --hidden-import PyQt6.QtGui --name "XOSSMonitor" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XOSSMonitor
        path: dist/XOSSMonitor.exe
