name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install flask bleak pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --add-data "templates;templates" --name "XOSSMonitor" flask_app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XOSSMonitor
        path: dist/XOSSMonitor.exe
