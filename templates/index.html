<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>XOSS Heart Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d4d0c8;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 11px;
    padding: 6px;
  }
  .window {
    background: #d4d0c8;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    padding: 8px;
    margin-bottom: 8px;
  }
  .window-label {
    font-weight: bold;
    font-size: 11px;
    margin-bottom: 6px;
    border-bottom: 1px solid #808080;
    padding-bottom: 3px;
  }
  button {
    background: #d4d0c8;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    min-width: 75px;
  }
  button:active {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }
  button:disabled {
    color: #808080;
    cursor: default;
  }
  input[type=number], input[type=text] {
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    background: #fff;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 11px;
    padding: 2px 4px;
  }
  input[type=number] { width: 50px; }
  input[type=text] { width: 180px; }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  .divider {
    width: 2px;
    height: 22px;
    border-left: 1px solid #808080;
    border-right: 1px solid #fff;
    margin: 0 4px;
  }
  .sim-badge {
    background: #808000;
    color: #fff;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: bold;
  }
  .sensors-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .sensor-card {
    background: #d4d0c8;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    padding: 6px 4px;
    text-align: center;
  }
  .sensor-card.connected { background: #f0f4f0; }
  .sensor-card.connecting { background: #fffff0; }
  .sensor-name { font-weight: bold; margin-bottom: 3px; font-size: 10px; }
  .hr-value {
    font-size: 30px;
    font-weight: bold;
    color: #800000;
    font-family: 'Courier New', monospace;
    line-height: 1.1;
  }
  .hr-value.off { color: #808080; font-size: 22px; }
  .hr-unit { font-size: 10px; color: #404040; }
  .status-text { font-size: 10px; margin: 2px 0 4px; }
  .status-text.on { color: #006400; }
  .status-text.off { color: #808080; }
  .status-text.connecting { color: #808000; }
  .card-btns { display: flex; gap: 3px; justify-content: center; }
  .card-btns button { min-width: 40px; padding: 2px 4px; font-size: 10px; }
  .empty-sensors {
    color: #808080;
    padding: 12px;
    text-align: center;
    font-size: 11px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    background: #fff;
  }
  th {
    background: #000080;
    color: #fff;
    padding: 3px 6px;
    border: 1px solid #808080;
    text-align: left;
    white-space: nowrap;
  }
  td {
    padding: 2px 6px;
    border: 1px solid #d4d0c8;
    white-space: nowrap;
  }
  tr:nth-child(even) td { background: #f0f0f0; }
  .table-wrap {
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    overflow-x: auto;
    max-height: 180px;
    overflow-y: auto;
    background: #fff;
  }
  .log-status { margin-bottom: 6px; }
  .log-status.active { color: #006400; font-weight: bold; }
  .log-status.off { color: #808080; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #d4d0c8;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    width: 400px;
    max-width: 95vw;
  }
  .modal-titlebar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    font-size: 11px;
    padding: 4px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .modal-close {
    background: #d4d0c8;
    border-top: 1px solid #fff;
    border-left: 1px solid #fff;
    border-right: 1px solid #404040;
    border-bottom: 1px solid #404040;
    font-size: 11px;
    font-weight: bold;
    width: 18px;
    height: 16px;
    cursor: pointer;
    padding: 0;
    min-width: unset;
    line-height: 14px;
    text-align: center;
  }
  .modal-body { padding: 10px; }
  .modal-section { margin-bottom: 10px; }
  .modal-section-label {
    font-weight: bold;
    margin-bottom: 5px;
    border-bottom: 1px solid #808080;
    padding-bottom: 2px;
  }
  .scan-list {
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    background: #fff;
    height: 160px;
    overflow-y: auto;
  }
  .scan-item {
    padding: 5px 8px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .scan-item:hover { background: #000080; color: #fff; }
  .scan-item:hover .addr { color: #aad; }
  .scan-item:hover .rssi-text { color: #aad; }
  .scan-item:hover button { background: #d4d0c8; color: #000; }
  .scan-item-left { flex: 1; min-width: 0; }
  .scan-item-name { font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr { font-size: 10px; color: #808080; font-family: 'Courier New', monospace; }
  .rssi-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .rssi-bars { display: flex; gap: 1px; align-items: flex-end; height: 12px; }
  .rssi-bar { width: 4px; background: #ccc; border-radius: 1px; }
  .rssi-bar.active { background: #006400; }
  .scan-item:hover .rssi-bar { background: #aad; }
  .scan-item:hover .rssi-bar.active { background: #00ff88; }
  .rssi-text { font-size: 10px; color: #808080; }
  .scan-item button { min-width: 55px; padding: 2px 6px; font-size: 11px; white-space: nowrap; }
  .scan-status { font-size: 10px; color: #808080; margin-top: 4px; }
  .modal-footer {
    padding: 6px 10px;
    border-top: 1px solid #808080;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }
  .added-list { margin-top: 4px; }
  .added-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 6px;
    border-bottom: 1px solid #e0e0e0;
    background: #fff;
  }
  .added-item:nth-child(even) { background: #f0f0f0; }
</style>
</head>
<body>

<div class="window">
  <div class="window-label">Управление</div>
  <div class="controls-row">
    <button onclick="openModal()">Управление датчиками</button>
    <div class="divider"></div>
    <button id="logBtn" onclick="toggleLog()">Начать запись</button>
    <div class="divider"></div>
    <label>Интервал (сек):</label>&nbsp;
    <input type="number" id="intervalInput" value="1" min="1" max="60">
    <button onclick="setInterval_()">Применить</button>
    <div class="divider"></div>
    <button onclick="window.open('/monitor','_blank','width=1200,height=700')">Открыть монитор</button>
    <div class="divider"></div>
    <span id="simBadge" class="sim-badge" style="display:none">СИМУЛЯЦИЯ</span>
  </div>
</div>

<div class="window">
  <div class="window-label">Датчики</div>
  <div class="sensors-grid" id="sensorsGrid">
    <div class="empty-sensors">Нет добавленных датчиков. Нажмите "Управление датчиками".</div>
  </div>
</div>

<div class="window">
  <div class="window-label">Журнал</div>
  <div class="log-status off" id="logStatus">Запись не активна</div>
  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-titlebar">
      Управление датчиками
      <button class="modal-close" onclick="closeModal()">X</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-label">Поиск устройств Bluetooth</div>
        <button onclick="startScan()" id="scanBtn">Начать поиск</button>
        <div class="scan-status" id="scanStatus">Нажмите "Начать поиск" для сканирования</div>
        <div class="scan-list" id="scanList"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">Добавленные датчики</div>
        <div class="added-list" id="addedList"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<script>
let loggingActive = false;
let isSimulation = false;
let prevSensorCount = -1;

async function fetchSensors() {
  try {
    const r = await fetch("/api/sensors");
    const data = await r.json();
    updateGrid(data);
    updateAddedList(data);
  } catch(e) {}
}

function updateGrid(data) {
  const grid = document.getElementById("sensorsGrid");
  if (data.length === 0) {
    grid.innerHTML = '<div class="empty-sensors">Нет добавленных датчиков. Нажмите "Управление датчиками".</div>';
    return;
  }
  if (data.length !== prevSensorCount) {
    grid.innerHTML = "";
    data.forEach(s => {
      const card = document.createElement("div");
      card.id = `card_${s.id}`;
      card.className = "sensor-card";
      card.innerHTML = `
        <div class="sensor-name" id="sname_${s.id}">${s.name}</div>
        <div class="hr-value off" id="hr_${s.id}">---</div>
        <div class="hr-unit" id="unit_${s.id}"></div>
        <div class="status-text off" id="status_${s.id}">Отключен</div>
        <div class="card-btns">
          <button id="cbtn_${s.id}">Подкл</button>
          <button onclick="removeSensor(${s.id})">Удалить</button>
        </div>`;
      grid.appendChild(card);
    });
    prevSensorCount = data.length;
  }
  data.forEach(s => {
    const card = document.getElementById(`card_${s.id}`);
    if (!card) return;
    card.className = "sensor-card" + (s.connected ? " connected" : s.status === "connecting" ? " connecting" : "");
    document.getElementById(`hr_${s.id}`).className = "hr-value" + (s.connected ? "" : " off");
    document.getElementById(`hr_${s.id}`).textContent = s.connected ? s.hr : "---";
    document.getElementById(`unit_${s.id}`).textContent = s.connected ? "уд/мин" : "";
    const st = document.getElementById(`status_${s.id}`);
    if (s.connected) { st.className = "status-text on"; st.textContent = "Подключен"; }
    else if (s.status === "connecting") { st.className = "status-text connecting"; st.textContent = "Подключение..."; }
    else { st.className = "status-text off"; st.textContent = "Отключен"; }
    const btn = document.getElementById(`cbtn_${s.id}`);
    btn.textContent = s.connected ? "Откл" : "Подкл";
    btn.onclick = s.connected ? () => disconnectSensor(s.id) : () => connectSensor(s.id);
  });
}

function updateAddedList(data) {
  const list = document.getElementById("addedList");
  if (data.length === 0) {
    list.innerHTML = '<div style="color:#808080;padding:4px 6px;font-size:10px">Нет добавленных датчиков</div>';
    return;
  }
  list.innerHTML = data.map(s => `
    <div class="added-item">
      <span><b>${s.name}</b> <span style="color:#808080;font-size:10px">${s.address}</span></span>
      <button onclick="removeSensor(${s.id})" style="min-width:50px;padding:1px 6px;font-size:10px">Удалить</button>
    </div>`).join("");
}

async function startScan() {
  document.getElementById("scanBtn").disabled = true;
  document.getElementById("scanStatus").textContent = "Поиск устройств...";
  document.getElementById("scanList").innerHTML = "";
  await fetch("/api/scan", {method:"POST"});
  pollScan();
}

function rssiToBars(rssi) {
  if (rssi === null || rssi === undefined) return 0;
  if (rssi >= -55) return 4;
  if (rssi >= -65) return 3;
  if (rssi >= -75) return 2;
  return 1;
}

function rssiToLabel(rssi) {
  if (rssi === null || rssi === undefined) return "нет данных";
  if (rssi >= -55) return `${rssi} дБм (отлично)`;
  if (rssi >= -65) return `${rssi} дБм (хорошо)`;
  if (rssi >= -75) return `${rssi} дБм (слабо)`;
  return `${rssi} дБм (очень слабо)`;
}

function makeBars(rssi) {
  const count = rssiToBars(rssi);
  const heights = [4, 7, 10, 13];
  return heights.map((h, i) =>
    `<div class="rssi-bar ${i < count ? 'active' : ''}" style="height:${h}px"></div>`
  ).join("");
}

function pollScan() {
  const interval = setInterval(async () => {
    const r = await fetch("/api/scan_results");
    const data = await r.json();
    const list = document.getElementById("scanList");
    if (data.results.length > 0) {
      list.innerHTML = data.results.map(d => `
        <div class="scan-item">
          <div class="scan-item-left">
            <div class="scan-item-name">${d.name}</div>
            <div class="addr">${d.address}</div>
            <div class="rssi-row">
              <div class="rssi-bars">${makeBars(d.rssi)}</div>
              <span class="rssi-text">${rssiToLabel(d.rssi)}</span>
            </div>
          </div>
          <button onclick="addSensor('${d.address}','${d.name}')">Добавить</button>
        </div>`).join("");
    }
    if (!data.scanning) {
      clearInterval(interval);
      document.getElementById("scanBtn").disabled = false;
      document.getElementById("scanStatus").textContent =
        data.results.length > 0 ? `Найдено устройств: ${data.results.length}` : "Устройства не найдены";
    }
  }, 500);
}

async function addSensor(address, name) {
  await fetch("/api/add_sensor", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({address, name})
  });
  prevSensorCount = -1;
  fetchSensors();
}

async function removeSensor(sid) {
  await fetch(`/api/remove_sensor/${sid}`, {method:"POST"});
  prevSensorCount = -1;
  fetchSensors();
}

async function connectSensor(sid) {
  await fetch(`/api/connect_sensor/${sid}`, {method:"POST"});
  fetchSensors();
}

async function disconnectSensor(sid) {
  await fetch(`/api/disconnect_sensor/${sid}`, {method:"POST"});
  fetchSensors();
}

function openModal() {
  document.getElementById("modalOverlay").classList.add("open");
  fetchSensors();
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

async function toggleLog() {
  if (!loggingActive) {
    await fetch("/api/start_log", {method:"POST"});
    loggingActive = true;
    document.getElementById("logBtn").textContent = "Остановить запись";
    document.getElementById("logStatus").textContent = "Запись активна...";
    document.getElementById("logStatus").className = "log-status active";
  } else {
    await fetch("/api/stop_log", {method:"POST"});
    loggingActive = false;
    document.getElementById("logBtn").textContent = "Начать запись";
    document.getElementById("logStatus").textContent = "Запись остановлена";
    document.getElementById("logStatus").className = "log-status off";
  }
}

async function setInterval_() {
  const val = document.getElementById("intervalInput").value;
  await fetch("/api/set_interval", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({interval: val})});
}

async function fetchLog() {
  try {
    const r = await fetch("/api/log");
    const rows = await r.json();
    if (!rows.length) return;
    const sensorCount = rows[0].length - 2;
    document.getElementById("tableHead").innerHTML = "<tr><th>Дата</th><th>Время</th>" +
      Array.from({length:sensorCount}, (_,i) => `<th>Датчик ${i+1}</th>`).join("") + "</tr>";
    document.getElementById("tableBody").innerHTML = [...rows].reverse().map(row =>
      "<tr>" + row.map(cell => `<td>${cell}</td>`).join("") + "</tr>"
    ).join("");
  } catch(e) {}
}

async function checkSimulation() {
  const r = await fetch("/");
  isSimulation = document.title.includes("sim") || false;
  const badge = document.getElementById("simBadge");
  const html = await r.text();
  if (html.includes("simulation=True") || html.includes("СИМУЛЯЦИЯ")) {
    badge.style.display = "inline";
  }
}

fetch("/api/sensors").then(r => r.json()).then(data => {
  if (data.length === 0) {
    fetch("/").then(r => r.text()).then(html => {
      if (html.includes("simulation")) {
        document.getElementById("simBadge").style.display = "inline";
      }
    });
  }
});

setInterval(fetchSensors, 1000);
setInterval(fetchLog, 1000);
fetchSensors();
</script>
</body>
    </html>
